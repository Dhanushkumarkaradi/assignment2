
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

<header class="header">
    <div class="header-content">
        <h1>Student Registration Portal</h1>
        <p>Register for your preferred course and college</p>
    </div>
</header>

<main class="container">

    <form id="registrationForm" action="process.php" method="POST">

        <div class="form-heading">
            <h2>Registration Form</h2>
            <p>Please fill in your details carefully.</p>
        </div>

        <!-- PERSONAL INFORMATION -->

        <section class="form-section">
            <h3>Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your full name" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>

            </div>
        </section>

        <!-- ACADEMIC INFORMATION -->

        <section class="form-section">
            <h3>Academic Information</h3>

            <div class="form-grid">

                <div class="form-group full-width">
                    <label for="college">Select College / Institution (Optional)</label>

                    <select id="college" name="college">
                        <option value="">Skip College Selection</option>
                        <option value="KLE Institute of Technology, Hubballi">
                            KLE Institute of Technology, Hubballi
                        </option>
                        <option value="KLE Technological University, Hubballi">
                            KLE Technological University, Hubballi
                        </option>
                        <option value="Other College">Other / Not Listed</option>
                    </select>

                    <input type="text" id="college_other" name="college_other"
                           class="other-input" placeholder="Enter your college name" hidden>
                </div>

                <div class="form-group">
                    <label for="course">Select Course / Degree *</label>

                    <select id="course" name="course" required>
                        <option value="">Choose Course</option>
                        <option value="BE">BE</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="ME">ME</option>
                        <option value="M.Tech">M.Tech</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="BBA">BBA</option>
                        <option value="MBA">MBA</option>
                        <option value="B.Com">B.Com</option>
                        <option value="M.Com">M.Com</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="M.Sc">M.Sc</option>
                        <option value="BA">BA</option>
                        <option value="MA">MA</option>
                        <option value="B.Arch">B.Arch</option>
                        <option value="Diploma">Diploma</option>
                        <option value="PhD">PhD</option>
                        <option value="Other">Other / Not Listed</option>
                    </select>

                    <input type="text" id="course_other" name="course_other"
                           class="other-input" placeholder="Enter your course / degree" hidden>
                </div>

                <div class="form-group">
                    <label for="branch">Select Branch / Specialisation *</label>

                    <select id="branch" name="branch" required>
                        <option value="">Choose Branch</option>
                        <option>Computer Science and Engineering</option>
                        <option>Information Science and Engineering</option>
                        <option>Artificial Intelligence and Machine Learning</option>
                        <option>Artificial Intelligence and Data Science</option>
                        <option>Data Science</option>
                        <option>Cyber Security</option>
                        <option>Electronics and Communication Engineering</option>
                        <option>Electrical and Electronics Engineering</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                        <option>Computer Applications</option>
                        <option>Finance</option>
                        <option>Marketing</option>
                        <option>Human Resource Management</option>
                        <option>Business Analytics</option>
                        <option>Accounting</option>
                        <option>Commerce</option>
                        <option>Mathematics</option>
                        <option>Physics</option>
                        <option>Chemistry</option>
                        <option>English</option>
                        <option>General</option>
                        <option value="Other">Other / Not Listed</option>
                        <option value="Not Applicable">Not Applicable</option>
                    </select>

                    <input type="text" id="branch_other" name="branch_other"
                           class="other-input" placeholder="Enter your branch / specialisation" hidden>
                </div>

                <div class="form-group">
                    <label for="year">Current Year of Study *</label>

                    <select id="year" name="year" required>
                        <option value="">Select Year</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                        <option>5th Year</option>
                        <option>Final Year</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="admission">Admission Type *</label>

                    <select id="admission" name="admission" required>
                        <option value="">Select Admission Type</option>
                        <option>Regular</option>
                        <option>Lateral Entry</option>
                        <option>Management Quota</option>
                        <option>Distance Education</option>
                        <option>Online</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>
        </section>

        <!-- ADDRESS INFORMATION -->

        <section class="form-section">
            <h3>Address Information</h3>

            <div class="form-group">
                <label for="address">Full Address *</label>

                <textarea id="address" name="address" rows="4"
                          placeholder="Enter your complete address" required></textarea>
            </div>
        </section>

        <!-- TERMS -->

        <div class="terms">
            <input type="checkbox" id="terms" name="terms"
                   value="accepted" required>

            <label for="terms">
                I confirm that the information provided above is correct.
            </label>
        </div>

        <!-- BUTTONS -->

        <div class="button-group">
            <button type="submit" class="submit-btn">
                Submit Registration
            </button>

            <button type="reset" class="reset-btn">
                Clear Form
            </button>
        </div>

    </form>

</main>

<footer>
    <p>© 2026 Student Registration Portal. All Rights Reserved.</p>
</footer>

</body>
</html>
